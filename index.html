<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Шахматы с ИИ</title>
    <!-- Подключаем стили доски -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* ТВОЙ ФОН (Темный градиент) */
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            font-family: sans-serif;
            color: white;
        }

        #board-container {
            width: 450px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 5px solid #333;
            border-radius: 5px;
        }

        #my_board {
            width: 100%;
        }

        .status-panel {
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 1.2rem;
        }

        /* СТИЛИ ПОДСВЕТКИ ХОДОВ */
        .highlight-white {
            box-shadow: inset 0 0 3px 3px rgba(255, 255, 255, 0.7);
            background-color: #a9db66 !important;
        }
        .highlight-black {
            box-shadow: inset 0 0 3px 3px rgba(255, 255, 255, 0.7);
            background-color: #69af43 !important;
        }
    </style>
</head>
<body>

    <h2>Шахматы против ИИ</h2>
    
    <div id="board-container">
        <div id="my_board"></div>
    </div>

    <div class="status-panel">
        Статус: <span id="status">Ваш ход</span>
    </div>

    <!-- Библиотеки -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
