<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chess Engine</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle, #1a2a6c 0%, #000000 100%);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        h2 { margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        #board-container {
            width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 6px solid #222;
            border-radius: 4px;
        }

        .status-panel {
            margin-top: 20px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            font-size: 1.1rem;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
            font-weight: bold;
        }

        #resign-btn { background-color: #e74c3c; color: white; }
        #resign-btn:hover { background-color: #c0392b; }

        #rematch-btn { background-color: #2ecc71; color: white; display: none; }
        #rematch-btn:hover { background-color: #27ae60; }

        .highlight-move {
            box-shadow: inset 0 0 3px 3px rgba(255, 255, 255, 0.7);
            background-color: #a9db66 !important;
        }
        
        #status-text { font-weight: bold; color: #ffeb3b; }
    </style>
</head>
<body>

    <h2>Chess vs Engine</h2>
    
    <div id="board-container">
        <div id="my_board"></div>
    </div>

    <div class="status-panel">
        Status: <span id="status-text">Initializing...</span>
        <div class="controls">
            <button id="resign-btn">Resign</button>
            <button id="rematch-btn">Rematch</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
